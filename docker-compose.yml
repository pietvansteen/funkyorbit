# Funky Orbit: website, hourly sync and likes API (docker compose up -d)
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"            # local address: http://<host>:8088
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
    depends_on: [likes]

  sync:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/sync.py"]
    environment:
      SHEET_ID: "1Qh2r1bgPZL8WfaWprVyHBpKyWuStGIyXX4Bdi4UFS1A"
      DONE_GID: "2105998367"
      PROGRESS_GID: "537922909"
      COLORS_GID: "7701"
      INTERVAL: "3600"       # every hour
      OUT_FILE: /data/data.json
      TZ: Europe/Amsterdam
    volumes:
      - ./sync:/app:ro
      - ./data:/data

  likes:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/likes.py"]
    environment:
      DB_FILE: /data/likes.db
      DATA_FILE: /data/data.json
    volumes:
      - ./likes:/app:ro
      - ./data:/data

  # Cloudflare Tunnel: makes funkyorbit.nl reachable without opening any ports.
  # The token goes in a .env file next to this file: TUNNEL_TOKEN=...
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [web]
