# Funky Orbit: website, daily sync, likes API and visitor statistics (docker compose up -d)
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"            # local address: http://<host>:8088
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
    depends_on: [likes, umami]

  sync:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/sync.py"]
    environment:
      SHEET_ID: "1Qh2r1bgPZL8WfaWprVyHBpKyWuStGIyXX4Bdi4UFS1A"
      DONE_GID: "2105998367"
      PROGRESS_GID: "537922909"
      COLORS_GID: "7701"
      FAMILIES_GID: "777000111"
      SYNC_COLORS_GID: "7703"
      DIFFICULTY_GID: "7710"
      INTERVAL: "86400"      # once a day; at once after logging a pattern on the Add page
      OUT_FILE: /data/data.json
      TZ: Europe/Amsterdam
    volumes:
      - ./sync:/app:ro
      - ./data:/data

  likes:
    image: python:3.13-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/likes.py"]
    environment:
      DB_FILE: /data/likes.db
      DATA_FILE: /data/data.json
      REQUESTS_DB: /data/requests.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # password for the requests and Add pages, from .env
      SHEET_WRITE_URL: ${SHEET_WRITE_URL:-}        # Apps Script web app that writes to Done (apps-script/FunkyOrbit.gs), from .env
      SHEET_WRITE_SECRET: ${SHEET_WRITE_SECRET:-}  # its SECRET script property, from .env
    volumes:
      - ./likes:/app:ro
      - ./data:/data

  # Visitor statistics (Umami). The site loads the tracker from /u/script.js and sends to /u/api/send (web/nginx.conf);
  # the dashboard is on http://<host>:3088 (log in, change the password of user admin, add the website).
  umami:
    image: ghcr.io/umami-software/umami:3
    restart: unless-stopped
    ports:
      - "3088:3000"          # dashboard: http://<host>:3088
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}   # any long random string, from .env
      CLIENT_IP_HEADER: cf-connecting-ip # the visitor's address from Cloudflare, not the tunnel's
      DISABLE_TELEMETRY: "1"
      TZ: Europe/Amsterdam
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}  # from .env
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloudflare Tunnel: makes funkyorbit.nl reachable without opening any ports.
  # The token goes in a .env file next to this file: TUNNEL_TOKEN=...
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [web]

volumes:
  umami-db:
