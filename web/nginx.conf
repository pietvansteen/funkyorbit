server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own name server, and the addresses in a variable: nginx then looks a container up again when it
    # restarts and gets a new address (otherwise /api/ gives 502 until web is restarted too)
    resolver 127.0.0.11 valid=10s;
    set $likes likes:8000;
    set $umami umami:3000;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # data.json comes from the sync container (shared /data folder)
    location = /data.json {
        alias /data/data.json;
        add_header Cache-Control "no-cache";
    }

    # likes API
    location /api/ {
        proxy_pass http://$likes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # visitor statistics (Umami): only the tracker script and the endpoint it sends to, not the dashboard
    location = /u/script.js {
        proxy_pass http://$umami/script.js;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /u/api/send {
        proxy_pass http://$umami/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
    }

    # the service worker must be checked for updates every time
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # index.html links css/js/svg with ?v=..., so they can be cached for a day
    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # the page itself is always revalidated, so a new ?v= is picked up at once.
    # likes.db and other files in /data are not reachable
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
