<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1322">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Funky Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html { background: #0d1322; color-scheme: dark; }</style>
<title>Add a pattern · Project Funky Orbit</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg?v=2.0.0-93ca32" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@300;500;600&display=swap">
<link rel="stylesheet" href="/style.css?v=2.0.0-93ca32">
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/" aria-label="Funky Orbit, home">
    <img src="/favicon.svg?v=2.0.0-93ca32" width="46" height="46" alt="">
    <b>Funky Orbit</b>
  </a>
  <nav class="nav" aria-label="Pages">
    <a href="/">Progress</a>
    <a href="/stats/">Stats</a>
    <a href="/patterns/">All patterns</a>
    <a href="/gen/">Generator</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero compact">
    <span class="label">Only for Piet &amp; Mees</span>
    <h1 class="num">Add a pattern</h1>
  </section>

  <form class="req-form login" id="login" hidden>
    <label>Password <input type="password" id="pw" autocomplete="current-password" required></label>
    <p class="req-msg" id="login-msg" role="status" hidden></p>
    <button type="submit" class="draw">Open</button>
  </form>

  <form class="req-form add-form" id="add" novalidate hidden>
    <div class="ss-field">
      <label for="ss">Siteswap <small>vanilla like 8556666, sync like 33p3 4p44</small></label>
      <input type="text" id="ss" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" required>
      <ul class="suggest" id="suggest" role="listbox" aria-label="Patterns" hidden></ul>
    </div>
    <div class="picked" id="picked" aria-live="polite"></div>
    <label>Date <input type="date" id="date" required></label>
    <div class="rate-field">
      <span class="rate-label" id="rate-label">Rating <small>how much fun it is, not how hard</small></span>
      <div class="rate-row">
        <div class="rate" id="rate" role="slider" tabindex="0" aria-labelledby="rate-label" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-valuetext="not rated">
          <span class="stars" style="--pct:0%"></span>
        </div>
        <span class="rate-value" id="rate-value">not rated</span>
        <button type="button" class="reset" id="rate-clear" hidden>Clear</button>
      </div>
    </div>
    <p class="req-msg" id="add-msg" role="status" hidden></p>
    <button type="submit" class="draw" id="add-send">Save pattern</button>
    <p class="add-foot"><button type="button" class="reset" id="logout">Log out on this device</button></p>
  </form>
</main>

<footer class="wrap"><span>funkyorbit.nl</span> <span class="foot-links"><a class="version" href="/changes/">v2.0.0 · What's new</a> · <a class="request-link" href="/request/">Request a feature</a></span></footer>
<script src="/shared.js?v=2.0.0-93ca32"></script>
<script src="/add/milestones.js?v=2.0.0-93ca32"></script>
<script src="/add/add.js?v=2.0.0-93ca32"></script>
</body>
</html>
