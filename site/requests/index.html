    <span class="label">Only for Piet &amp; Mees</span>
    <h1 class="num" id="req-title">Requests</h1>

  <form class="req-form login" id="login" hidden>

    <div class="admin-bar">
      <span class="label" id="req-count"></span>
      <button type="button" class="reset" id="csv">Download CSV</button>
      <button type="button" class="reset" id="logout">Log out on this device</button>

    <div class="req-list" id="req-list"></div>
  </div>
</main>
