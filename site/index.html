<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funky Orbit</title>
<meta name="description" content="Follow our progress through hundreds of club passing patterns, with videos of every pattern we land.">
<link rel="icon" href="favicon.svg?v=20261019b" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@300;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261019b">
</head>
<body>
<header class="wrap top">
  <a class="brand" href="./" aria-label="Funky Orbit, home">
    <img src="favicon.svg?v=20261019b" width="46" height="46" alt="">
    <b>Funky Orbit</b>
  </a>
  <span class="updated" id="updated"></span>
</header>

<main class="wrap">
  <section class="hero" id="hero" aria-live="polite"><span class="label">Loading progress…</span></section>

  <section aria-labelledby="h-groups">
    <div class="section-head"><h2 id="h-groups">Progress by category</h2></div>
    <div class="tiles" id="tiles" role="group" aria-label="Categories"></div>
    <div class="detail" id="detail" hidden></div>
  </section>

  <section aria-labelledby="h-feed">
    <div class="section-head">
      <div>
        <h2 id="h-feed">Videos</h2>
        <span class="label" id="feed-count"></span>
      </div>
      <div class="legend" aria-label="Digits are coloured by club"><span><i class="sw c-w"></i>white</span><span><i class="sw c-b"></i>blue</span><span><i class="sw c-o"></i>orange</span><span><i class="sw c-r"></i>pink</span></div>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input type="search" id="search" placeholder="Search by siteswap or name, e.g. 96677 or Uwe" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search patterns by siteswap or name">
    </label>
    <div class="feed" id="feed"></div>
  </section>

  <section aria-labelledby="h-rest" id="rest-wrap" hidden>
    <div class="section-head"><h2 id="h-rest">Thrown, video coming soon</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Siteswap</th><th>Name</th><th>Family</th><th>Rating</th><th>Date</th></tr></thead>
        <tbody id="rest"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="wrap">funkyorbit.nl · Progress is updated every hour from our practice list.</footer>
<script src="app.js?v=20261019b"></script>
</body>
</html>
