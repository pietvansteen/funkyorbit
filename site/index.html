<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funky Orbit</title>
<meta name="description" content="Volg hoe ver we zijn met het gooien van honderden club-passingpatronen, met video's van elk gelukt patroon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='13' ry='6.5' transform='rotate(-30 16 16)' fill='none' stroke='%23128f82' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2315203b'/%3E%3Ccircle cx='26.5' cy='9.5' r='3' fill='%23d1256c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@300;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wrap top">
  <a class="brand" href="./" aria-label="Funky Orbit, home">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
      <ellipse cx="16" cy="16" rx="13" ry="6.5" transform="rotate(-30 16 16)" fill="none" stroke="var(--orbit)" stroke-width="2.5"/>
      <circle cx="16" cy="16" r="4" fill="var(--ink)"/>
      <circle cx="26.5" cy="9.5" r="3" fill="var(--club)"/>
    </svg>
    <b>Funky Orbit</b>
  </a>
  <span class="updated" id="updated"></span>
</header>

<main class="wrap">
  <section class="hero" id="hero" aria-live="polite"><span class="label">Voortgang laden…</span></section>

  <section aria-labelledby="h-groups">
    <div class="section-head">
      <h2 id="h-groups">Per categorie</h2>
      <div class="chips" id="chips" role="group" aria-label="Filter op soort patroon"></div>
    </div>
    <div class="groups" id="groups"></div>
    <p class="note" id="groups-note" hidden></p>
  </section>

  <section aria-labelledby="h-feed">
    <div class="section-head">
      <div>
        <h2 id="h-feed">Video's</h2>
        <span class="label" id="feed-count"></span>
      </div>
      <div class="legend"><span class="ss"><b>6</b></span> self <span class="ss"><b class="p">7</b></span> pass</div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <section aria-labelledby="h-rest" id="rest-wrap" hidden>
    <div class="section-head"><h2 id="h-rest">Gegooid, video volgt</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Siteswap</th><th>Naam</th><th>Familie</th><th>Beoordeling</th><th>Datum</th></tr></thead>
        <tbody id="rest"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="wrap">funkyorbit.nl · De voortgang wordt elk uur bijgewerkt vanuit onze oefenlijst.</footer>
<script src="app.js"></script>
</body>
</html>
