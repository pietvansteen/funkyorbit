<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <!-- Three juggling clubs. One club: pink top, body in currentColor, white tape, turquoise handle, pink knob. -->
  <defs>
    <clipPath id="body">
      <path d="M7 0C11.2 0 13 3.6 13 9 13 16 9.7 22 9 30H5C4.3 22 1 16 1 9 1 3.6 2.8 0 7 0Z"/>
    </clipPath>
    <symbol id="club" viewBox="-1 -1 16 54" overflow="visible">
      <g clip-path="url(#body)">
        <rect x="0" y="-1" width="14" height="32" fill="currentColor"/>
        <rect x="0" y="-1" width="14" height="6.5" fill="#ec5fa6"/>
        <rect x="0" y="22.5" width="14" height="2.4" fill="#ffffff"/>
      </g>
      <path d="M7 0C11.2 0 13 3.6 13 9 13 16 9.7 22 9 30H5C4.3 22 1 16 1 9 1 3.6 2.8 0 7 0Z" fill="none" stroke="#15203b" stroke-width="1.1" stroke-linejoin="round"/>
      <rect x="5.3" y="29.6" width="3.4" height="17.6" rx="1.2" fill="#19c3b3" stroke="#15203b" stroke-width="1.1"/>
      <ellipse cx="7" cy="48.6" rx="3.3" ry="2" fill="#ec5fa6" stroke="#15203b" stroke-width="1.1"/>
    </symbol>
  </defs>
  <use href="#club" xlink:href="#club" x="-8" y="-1" width="16" height="54" color="#f28c28" transform="rotate(-21 32 66) translate(32 7)"/>
  <use href="#club" xlink:href="#club" x="-8" y="-1" width="16" height="54" color="#1e3a8a" transform="rotate(21 32 66) translate(32 7)"/>
  <use href="#club" xlink:href="#club" x="-8" y="-1" width="16" height="54" color="#f6f5f0" transform="translate(32 7)"/>
</svg>
