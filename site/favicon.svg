<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-75 -4 150 152">
  <!-- Three juggling clubs, drawn to the proportions of the real ones (body up).
       One club: pink end cap, body in currentColor, white tape, turquoise handle, pink knob. -->
  <defs>
    <g id="club" stroke="#15203b" stroke-width="2.2" stroke-linejoin="round">
      <path d="M-4 79H4L2.8 137.5H-2.8Z" fill="#2bb5aa"/>
      <rect x="-5" y="135.5" width="10" height="8" rx="3.4" fill="#d93a78"/>
      <path d="M-6.5 3C-9.6 12-11.6 24-11.6 33C-11.6 45-6.4 60-4.8 74H4.8C6.4 60 11.6 45 11.6 33C11.6 24 9.6 12 6.5 3Z" fill="currentColor"/>
      <rect x="-5.2" y="73" width="10.4" height="6.2" rx="0.8" fill="#f4f5f7"/>
      <rect x="-7" y="-0.5" width="14" height="4.4" rx="1.8" fill="#d93a78"/>
    </g>
  </defs>
  <use href="#club" xlink:href="#club" color="#ee5a2c" transform="rotate(-21 0 132)"/>
  <use href="#club" xlink:href="#club" color="#1f4fd1" transform="rotate(21 0 132)"/>
  <use href="#club" xlink:href="#club" color="#eeeff2"/>
</svg>
