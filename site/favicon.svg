<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-74 -3 148 148">
  <!-- Logo v2: three juggling clubs (body up) whose handles cross below the tape.
       One club: pink end cap, body in currentColor, white tape, turquoise handle, pink knob. -->
  <defs>
    <g id="club" stroke="#15203b" stroke-width="2.4" stroke-linejoin="round">
      <path d="M-4 78H4L3 135.5H-3Z" fill="#2bb5aa"/>
      <rect x="-5" y="135" width="10" height="7.6" rx="3" fill="#d93a78"/>
      <path d="M-6.4 3.4C-9.6 12-11.6 24-11.6 33C-11.6 45-6.4 60-4.8 74H4.8C6.4 60 11.6 45 11.6 33C11.6 24 9.6 12 6.4 3.4Z" fill="currentColor"/>
      <rect x="-5.2" y="73.6" width="10.4" height="4.6" rx="0.6" fill="#f4f5f7"/>
      <rect x="-6.6" y="-1.2" width="13.2" height="4.4" rx="1.6" fill="#d93a78"/>
    </g>
  </defs>
  <!-- the handles cross at (0, 99): blue at the back, then white, orange in front -->
  <use href="#club" xlink:href="#club" color="#1f4fd1" transform="rotate(19 0 99)"/>
  <use href="#club" xlink:href="#club" color="#eeeff2"/>
  <use href="#club" xlink:href="#club" color="#ee5a2c" transform="rotate(-19 0 99)"/>
</svg>
